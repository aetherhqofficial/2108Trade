# 2108Trade — Local development and production deployment
# Start everything: docker compose up
# Start with TLS: docker compose --profile tls up
# Start with AI: docker compose --profile ai up
# Start with monitoring: docker compose -f docker-compose.yml -f docker-compose.monitoring.yml up
#
# ── Service Discovery ──────────────────────────────────────────────────────
# All services communicate over the `2108trade` bridge network. Docker
# Compose DNS resolves service names to container IPs automatically:
#
#   Service      Internal Hostname     Port
#   ───────────  ────────────────────  ────
#   postgres     postgres              5432
#   redis        redis                 6379
#   minio        minio                 9000
#   web          web                   3000
#   landing      landing               3000
#   worker       worker                (no exposed port)
#   quant        quant                 8002
#   ai-service   ai-service            8001
#   ollama       ollama                11434
#
# Example: The web app connects to Redis at `redis://redis:6379`
# and to PostgreSQL at `postgresql://...@postgres:5432/...`.
#
# External clients connect via published ports (host:container mapping).

services:
  # ── Landing page (public-facing marketing site) ──────────────────────
  landing:
    build:
      context: .
      dockerfile: apps/landing/Dockerfile
    expose:
      - "3000"
    restart: unless-stopped
    environment:
      - NODE_ENV=${NODE_ENV:-production}
    networks:
      - 2108trade

  # ── Web app (main platform) ──────────────────────────────────────────
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    expose:
      - "3000"
    restart: unless-stopped
    environment:
      - NODE_ENV=${NODE_ENV:-production}
      - DATABASE_URL=postgresql://${POSTGRES_USER:-2108trade}:${POSTGRES_PASSWORD:-2108trade}@postgres:5432/${POSTGRES_DB:-2108trade}
      - REDIS_URL=redis://redis:6379
      - ENCRYPTION_KEY=${ENCRYPTION_KEY:-}
      - MINIO_ENDPOINT=${MINIO_ENDPOINT:-minio}
      - MINIO_PORT=${MINIO_PORT:-9000}
      - MINIO_ROOT_USER=${MINIO_ROOT_USER:-minioadmin}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD:-minioadmin}
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:3001}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - 2108trade

  # ── Background Worker (BullMQ job processor) ─────────────────────────
  worker:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    entrypoint: ["bun", "run", "apps/web/src/worker.ts"]
    restart: unless-stopped
    environment:
      - NODE_ENV=${NODE_ENV:-production}
      - DATABASE_URL=postgresql://${POSTGRES_USER:-2108trade}:${POSTGRES_PASSWORD:-2108trade}@postgres:5432/${POSTGRES_DB:-2108trade}
      - REDIS_URL=redis://redis:6379
      - ENCRYPTION_KEY=${ENCRYPTION_KEY:-}
      - MINIO_ENDPOINT=${MINIO_ENDPOINT:-minio}
      - MINIO_PORT=${MINIO_PORT:-9000}
      - MINIO_ROOT_USER=${MINIO_ROOT_USER:-minioadmin}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD:-minioadmin}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - 2108trade

  # ── PostgreSQL ───────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-2108trade}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-2108trade}
      POSTGRES_DB: ${POSTGRES_DB:-2108trade}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-2108trade} -d ${POSTGRES_DB:-2108trade}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - 2108trade

  # ── Redis ────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_PORT:-6379}:6379"
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - 2108trade

  # ── MinIO (S3-compatible object storage) ─────────────────────────────
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - 2108trade

  # ── Backup Cron ──────────────────────────────────────────────────────
  backup-cron:
    build:
      context: .
      dockerfile: scripts/backup-cron.Dockerfile
    restart: unless-stopped
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USER: ${POSTGRES_USER:-2108trade}
      DB_NAME: ${POSTGRES_DB:-2108trade}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-2108trade}
      BACKUP_DIR: /backups
      RETENTION_DAILY: "7"
      RETENTION_WEEKLY: "4"
    volumes:
      - backup_data:/backups
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - 2108trade

  # ── Nginx (TLS Reverse Proxy) ───────────────────────────────────────
  nginx:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
      - "443:443"
    restart: unless-stopped
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - nginx_certs:/etc/nginx/certs:ro
    profiles:
      - tls
      - full
    depends_on:
      - landing
      - web
    networks:
      - 2108trade

  # ── Quant Service ───────────────────────────────────────────────────────
  quant:
    build:
      context: ./services/quant
      dockerfile: Dockerfile
    ports:
      - "${QUANT_SERVICE_PORT:-8002}:8002"
    restart: unless-stopped
    environment:
      - LOG_LEVEL=${LOG_LEVEL:-info}
    networks:
      - 2108trade

  # ── AI Service ────────────────────────────────────────────────────────
  ai-service:
    build:
      context: ./services/ai
      dockerfile: Dockerfile
    ports:
      - "${AI_SERVICE_PORT:-8001}:8001"
    restart: unless-stopped
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
      - OLLAMA_MODEL=${OLLAMA_MODEL:-llama3.1:8b}
      - LOG_LEVEL=${LOG_LEVEL:-info}
    profiles:
      - ai
      - full
    networks:
      - 2108trade

  # ── Ollama (placeholder — coming soon) ───────────────────────────────
  ollama:
    image: ollama/ollama:latest
    ports:
      - "${OLLAMA_PORT:-11434}:11434"
    profiles:
      - ai
      - full
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - 2108trade

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  minio_data:
    driver: local
  ollama_data:
    driver: local
  backup_data:
    driver: local
  nginx_certs:
    driver: local

networks:
  2108trade:
    driver: bridge
    name: 2108trade
