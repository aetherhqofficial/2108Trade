# 2108Trade Prometheus configuration
global:
  scrape_interval: 15s
  evaluation_interval: 15s
  scrape_timeout: 10s

# Alertmanager
alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

# Rule files
rule_files:
  - "alert-rules.yml"

scrape_configs:
  # Landing page metrics
  - job_name: "landing"
    metrics_path: /metrics
    static_configs:
      - targets: ["landing:3000"]
    scrape_interval: 30s

  # Web app metrics
  - job_name: "web"
    metrics_path: /metrics
    static_configs:
      - targets: ["web:3000"]
    scrape_interval: 30s

  # AI service metrics (placeholder)
  - job_name: "ai-service"
    metrics_path: /metrics
    static_configs:
      - targets: ["ai-service:8001"]
    scrape_interval: 30s

  # PostgreSQL metrics
  - job_name: "postgres-exporter"
    static_configs:
      - targets: ["postgres-exporter:9187"]
    scrape_interval: 30s

  # Prometheus self-monitoring
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]
