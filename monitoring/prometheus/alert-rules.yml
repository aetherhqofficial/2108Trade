groups:
  - name: 2108trade
    rules:
      - alert: HighErrorRate
        expr: |
          rate(http_requests_total{status=~"5.."}[5m]) / rate(http_requests_total[5m]) > 0.05
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "High error rate (>5%) on {{ $labels.instance }}"
          description: "Error rate is {{ $value | humanizePercentage }} over 5 minutes."

      - alert: ServiceDown
        expr: up == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.instance }} is down"
          description: "Service has been unreachable for 1 minute."

      - alert: HighLatency
        expr: histogram_quantile(0.95, rate(http_request_duration_seconds_bucket[5m])) > 2
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High p95 latency on {{ $labels.instance }}"
          description: "p95 latency is {{ $value }}s over 5 minutes."

      - alert: DBConnectionPoolHigh
        expr: pg_stat_database_numbackends / pg_settings_max_connections > 0.8
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Database connection pool >80%"
          description: "{{ $value | humanizePercentage }} of connections used."

      - alert: BackupFailure
        expr: time() - backup_last_success_timestamp_seconds > 90000
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "No successful backup in 25 hours"
          description: "Last backup was {{ $value | humanizeDuration }} ago."
