name: Release

on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "**.md"

permissions:
  contents: write
  packages: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get version
        id: version
        run: |
          # Read version from package.json, auto-increment patch
          VERSION=$(node -p "require('./package.json').version")
          echo "current=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=v$VERSION" >> $GITHUB_OUTPUT

      - name: Create tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "${{ steps.version.outputs.tag }}" -m "Release ${{ steps.version.outputs.tag }}"
          git push origin "${{ steps.version.outputs.tag }}"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker images
        run: |
          TAG=${{ steps.version.outputs.tag }}

          # Landing
          docker build -f apps/landing/Dockerfile -t ghcr.io/${{ github.repository }}/landing:$TAG -t ghcr.io/${{ github.repository }}/landing:latest .
          docker push ghcr.io/${{ github.repository }}/landing:$TAG
          docker push ghcr.io/${{ github.repository }}/landing:latest

          # Web
          docker build -f apps/web/Dockerfile -t ghcr.io/${{ github.repository }}/web:$TAG -t ghcr.io/${{ github.repository }}/web:latest .
          docker push ghcr.io/${{ github.repository }}/web:$TAG
          docker push ghcr.io/${{ github.repository }}/web:latest

          # AI Service
          docker build -f services/ai/Dockerfile services/ai -t ghcr.io/${{ github.repository }}/ai-service:$TAG -t ghcr.io/${{ github.repository }}/ai-service:latest .
          docker push ghcr.io/${{ github.repository }}/ai-service:$TAG
          docker push ghcr.io/${{ github.repository }}/ai-service:latest

          # Quant Service
          docker build -f services/quant/Dockerfile services/quant -t ghcr.io/${{ github.repository }}/quant:$TAG -t ghcr.io/${{ github.repository }}/quant:latest .
          docker push ghcr.io/${{ github.repository }}/quant:$TAG
          docker push ghcr.io/${{ github.repository }}/quant:latest
