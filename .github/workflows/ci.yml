name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # ── Lint & Type-check ────────────────────────────────────────────────
  lint-and-typecheck:
    name: Lint & Type-check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Cache Bun dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.bun/install/cache
            node_modules
            apps/*/node_modules
            packages/*/node_modules
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Type-check
        run: bun run typecheck

  # ── Test ──────────────────────────────────────────────────────────────
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Cache Bun dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.bun/install/cache
            node_modules
            apps/*/node_modules
            packages/*/node_modules
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run tests
        run: bun run test

  # ── Docker Build Validation ──────────────────────────────────────────
  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [lint-and-typecheck, test]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build landing image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/landing/Dockerfile
          push: false
          load: false
          cache-from: type=gha,scope=landing
          cache-to: type=gha,scope=landing,mode=max

      - name: Build web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: false
          load: false
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max

  # ── Docker Compose Smoke Test ────────────────────────────────────────
  compose-smoke-test:
    name: Compose Smoke Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [docker-build]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build all images
        run: docker compose build

      - name: Start services
        run: |
          docker compose up -d postgres redis
          # Wait for healthy
          for i in $(seq 1 30); do
            if docker compose ps postgres | grep -q "healthy"; then
              echo "Postgres healthy"
              break
            fi
            sleep 2
          done
          for i in $(seq 1 30); do
            if docker compose ps redis | grep -q "healthy"; then
              echo "Redis healthy"
              break
            fi
            sleep 2
          done

      - name: Verify services
        run: |
          docker compose ps
          curl -f --retry 5 --retry-delay 2 http://localhost:3000 || echo "Landing not ready yet (may need app build first)"
          curl -f --retry 5 --retry-delay 2 http://localhost:3001 || echo "Web not ready yet (may need app build first)"

      - name: Cleanup
        if: always()
        run: docker compose down -v --remove-orphans

  # ── Backup Smoke Test ────────────────────────────────────────────────
  backup-smoke-test:
    name: Backup Smoke Test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [lint-and-typecheck]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: 2108trade
          POSTGRES_PASSWORD: 2108trade
          POSTGRES_DB: 2108trade
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U 2108trade -d 2108trade"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client

      - name: Make scripts executable
        run: chmod +x scripts/backup.sh scripts/restore.sh

      - name: Create test data
        run: |
          export PGPASSWORD=2108trade
          psql -h localhost -U 2108trade -d 2108trade <<'SQL'
            CREATE TABLE IF NOT EXISTS test_users (
              id SERIAL PRIMARY KEY,
              name TEXT NOT NULL,
              email TEXT NOT NULL UNIQUE,
              created_at TIMESTAMPTZ DEFAULT NOW()
            );
            INSERT INTO test_users (name, email) VALUES
              ('Alice', 'alice@test.com'),
              ('Bob', 'bob@test.com'),
              ('Carol', 'carol@test.com');
          SQL

      - name: Verify test data
        run: |
          export PGPASSWORD=2108trade
          COUNT=$(psql -h localhost -U 2108trade -d 2108trade -t -c "SELECT COUNT(*) FROM test_users;")
          echo "Row count: $COUNT"
          if [ "$COUNT" -ne "3" ]; then
            echo "ERROR: Expected 3 rows, got $COUNT"
            exit 1
          fi
          echo "Test data verified: 3 rows"

      - name: Run backup
        run: |
          export DB_HOST=localhost
          export DB_USER=2108trade
          export DB_NAME=2108trade
          export DB_PASSWORD=2108trade
          export BACKUP_DIR=./backups
          ./scripts/backup.sh

      - name: Verify backup file
        run: |
          BACKUP_FILE=$(ls -1t backups/2108trade_*.sql.gz 2>/dev/null | head -1)
          if [ -z "$BACKUP_FILE" ]; then
            echo "ERROR: No backup file found"
            exit 1
          fi
          echo "Backup file: $BACKUP_FILE"
          # Check file is non-empty and contains expected data
          gunzip -c "$BACKUP_FILE" | grep -q "test_users" || {
            echo "ERROR: Backup does not contain test_users table"
            exit 1
          }
          gunzip -c "$BACKUP_FILE" | grep -q "Alice" || {
            echo "ERROR: Backup does not contain test data (Alice)"
            exit 1
          }
          echo "Backup verification passed"

      - name: Restore from backup
        run: |
          BACKUP_FILE=$(ls -1t backups/2108trade_*.sql.gz | head -1)
          export DB_HOST=localhost
          export DB_USER=2108trade
          export DB_NAME=2108trade
          export DB_PASSWORD=2108trade
          ./scripts/restore.sh "$BACKUP_FILE" --force

      - name: Verify restored data
        run: |
          export PGPASSWORD=2108trade
          COUNT=$(psql -h localhost -U 2108trade -d 2108trade -t -c "SELECT COUNT(*) FROM test_users;")
          echo "Row count after restore: $COUNT"
          if [ "$COUNT" -ne "3" ]; then
            echo "ERROR: Expected 3 rows after restore, got $COUNT"
            exit 1
          fi
          echo "Restore verification passed: 3 rows restored"
