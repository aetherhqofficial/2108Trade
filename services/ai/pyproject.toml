[project]
name = "2108trade-ai"
version = "0.1.0"
description = "2108Trade AI intelligence layer — multi-agent pipeline for explainable trade recommendations"
requires-python = ">=3.11"
license = { text = "AGPL-3.0-only" }
authors = [{ name = "2108Trade Team" }]

dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "httpx>=0.27.0",
    "langgraph>=0.2.0",
    "langchain>=0.3.0",
    "langchain-community>=0.3.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "chromadb>=0.5.0",
    "openai>=1.0.0",
    "opentelemetry-api>=1.26.0",
    "opentelemetry-sdk>=1.26.0",
    "opentelemetry-instrumentation-fastapi>=0.47b0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "httpx-sse>=0.4.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
