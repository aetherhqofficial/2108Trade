[project]
name = "2108trade-quant"
version = "0.1.0"
description = "2108Trade Quantitative Strategy Framework — data pipeline, indicator library, and strategy engine"
requires-python = ">=3.11"
license = { text = "AGPL-3.0-only" }
authors = [{ name = "2108Trade Team" }]

dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "httpx>=0.27.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "TA-Lib>=0.4.28",
    "ccxt>=4.3.0",
    "pyarrow>=17.0.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
