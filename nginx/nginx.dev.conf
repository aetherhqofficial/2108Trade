# ── 2108Trade Development Nginx Configuration ────────────────────────────
# TLS-terminating reverse proxy using self-signed certificates.
# Use scripts/generate-dev-certs.sh to create the certs first.
#
# Certificates expected at:
#   /etc/nginx/certs/2108trade.local.crt
#   /etc/nginx/certs/2108trade.local.key

user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
  worker_connections 1024;
  multi_accept on;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  # ── Logging ──────────────────────────────────────────────────────────
  log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                  '$status $body_bytes_sent "$http_referer" '
                  '"$http_user_agent" "$http_x_forwarded_for"';

  access_log /var/log/nginx/access.log main buffer=16k flush=2s;

  # ── Performance ──────────────────────────────────────────────────────
  sendfile on;
  tcp_nopush on;
  tcp_nodelay on;
  keepalive_timeout 65;
  client_max_body_size 10m;

  # ── SSL / TLS (dev-friendly) ─────────────────────────────────────────
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384';
  ssl_prefer_server_ciphers on;

  # ── Gzip ─────────────────────────────────────────────────────────────
  gzip on;
  gzip_vary on;
  gzip_proxied any;
  gzip_comp_level 6;
  gzip_types text/plain text/css text/xml application/json application/javascript;

  # ── Upstreams ────────────────────────────────────────────────────────
  upstream web {
    server web:3000;
  }

  upstream landing {
    server landing:3000;
  }

  # ── HTTP → HTTPS Redirect ────────────────────────────────────────────
  server {
    listen 80;
    listen [::]:80;
    server_name _;

    location / {
      return 301 https://$host$request_uri;
    }
  }

  # ── HTTPS Server ─────────────────────────────────────────────────────
  server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name _;

    ssl_certificate /etc/nginx/certs/2108trade.local.crt;
    ssl_certificate_key /etc/nginx/certs/2108trade.local.key;

    # ── Proxy Headers ─────────────────────────────────────────────────
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Port $server_port;
    proxy_read_timeout 60s;
    proxy_connect_timeout 10s;
    proxy_send_timeout 60s;

    # ── Landing Page ──────────────────────────────────────────────────
    location / {
      proxy_pass http://landing;
    }

    # ── Web App ───────────────────────────────────────────────────────
    location /app/ {
      rewrite ^/app/(.*) /$1 break;
      proxy_pass http://web;
    }

    # ── API Endpoints ─────────────────────────────────────────────────
    location /api/ {
      proxy_pass http://web;
    }

    # ── Health Check ──────────────────────────────────────────────────
    location /health {
      access_log off;
      return 200 "OK\n";
      add_header Content-Type text/plain;
    }
  }
}
